name: Deploy Worker

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Cache dependencies
              uses: actions/cache@v5
              with:
                  path: '**/node_modules'
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Cache Rust
              uses: Swatinem/rust-cache@v2

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install JS dependencies (pinned wrangler)
              run: bun install --frozen-lockfile

            - name: Set custom domain
              env:
                  CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
              run: |
                  set -euo pipefail
                  if [ -z "${CUSTOM_DOMAIN:-}" ]; then
                    echo "::error::GitHub variable CUSTOM_DOMAIN is missing or empty"
                    exit 1
                  fi
                  sed -i "s|pattern = \".*\"|pattern = \"$CUSTOM_DOMAIN\"|" wrangler.toml
                  grep -F "pattern = \"$CUSTOM_DOMAIN\"" wrangler.toml

            - name: Deploy to Cloudflare Workers
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: bun run deploy

            - name: Sync Worker secrets
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  STABLE_EMAIL: ${{ secrets.STABLE_EMAIL }}
                  STABLE_AAS_TOKEN: ${{ secrets.STABLE_AAS_TOKEN }}
                  BETA_EMAIL: ${{ secrets.BETA_EMAIL }}
                  BETA_AAS_TOKEN: ${{ secrets.BETA_AAS_TOKEN }}
                  ALPHA_EMAIL: ${{ secrets.ALPHA_EMAIL }}
                  ALPHA_AAS_TOKEN: ${{ secrets.ALPHA_AAS_TOKEN }}
              run: |
                  set -euo pipefail
                  for name in STABLE_EMAIL STABLE_AAS_TOKEN; do
                    value="${!name:-}"
                    if [ -z "$value" ]; then
                      echo "::error::GitHub secret $name is missing or empty"
                      exit 1
                    fi
                    printf '%s' "$value" | bunx --bun wrangler secret put "$name"
                  done
                  for name in BETA_EMAIL BETA_AAS_TOKEN ALPHA_EMAIL ALPHA_AAS_TOKEN; do
                    value="${!name:-}"
                    if [ -z "$value" ]; then
                      echo "::warning::GitHub secret $name is missing or empty, skipping"
                      continue
                    fi
                    printf '%s' "$value" | bunx --bun wrangler secret put "$name"
                  done
