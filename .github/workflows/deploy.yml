name: Deploy Worker

on:
    push:
        branches:
            - 'v*'
    workflow_dispatch:

concurrency:
    group: deploy-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    deploy:
        if: startsWith(github.ref_name, 'v')
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Cache Bun
              uses: actions/cache@v5
              with:
                  path: '**/node_modules'
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Cache Rust
              uses: Swatinem/rust-cache@v2

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Bun install
              run: bun install --frozen-lockfile

            - name: Configure branch deployment
              env:
                  API_BRANCH: ${{ github.ref_name }}
              run: |
                  python3 - <<'PYTHON'
                  import json
                  import os
                  import tomllib
                  from pathlib import Path

                  branch = os.environ["API_BRANCH"]
                  config = tomllib.loads(Path("wrangler.toml").read_text())
                  config["name"] = f"sniff-{branch}"
                  config["routes"] = [
                      {"pattern": f"sniff.madkarma.top/{branch}", "zone_name": "madkarma.top"},
                      {"pattern": f"sniff.madkarma.top/{branch}/*", "zone_name": "madkarma.top"},
                  ]
                  if branch == "v2":
                      config["routes"].append({"pattern": "sniff.madkarma.top/*", "zone_name": "madkarma.top"})
                  Path("wrangler.deploy.json").write_text(json.dumps(config))
                  PYTHON

            - name: Ensure proxied DNS record
              if: github.ref_name == 'v2'
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  python3 - <<'PYTHON'
                  import json
                  import os
                  import urllib.error
                  import urllib.request

                  zone = "7755ca3a0a589f2307fb97d2632d4314"
                  hostname = "sniff.madkarma.top"
                  base = "https://api.cloudflare.com/client/v4"
                  dns = f"{base}/zones/{zone}/dns_records"
                  domains = f"{base}/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/workers/domains"
                  headers = {"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"], "Content-Type": "application/json"}
                  def api(url, data=None, method=None):
                      request = urllib.request.Request(url, headers=headers, data=json.dumps(data).encode() if data else None, method=method)
                      try:
                          with urllib.request.urlopen(request, timeout=30) as response:
                              result = json.load(response)
                      except urllib.error.HTTPError as error:
                          raise RuntimeError(f"Cloudflare API returned {error.code}: {error.read().decode()}") from None
                      if not result.get("success"):
                          raise RuntimeError(f"Cloudflare request failed: {result.get('errors')}")
                      return result.get("result")

                  def ensure_dns():
                      records = api(dns + "?name=" + hostname)
                      matching = [record for record in records if record["type"] == "AAAA" and record["content"] == "100::" and record["proxied"]]
                      if matching:
                          print("Proxied DNS record already exists")
                      else:
                          api(dns, {"type": "AAAA", "name": hostname, "content": "100::", "proxied": True, "ttl": 1})
                          print("Created proxied AAAA record for " + hostname)

                  # Verify DNS access before changing any custom-domain attachment.
                  api(dns + "?name=" + hostname)
                  attached = [domain for domain in api(domains) if domain["hostname"] == hostname]
                  for domain in attached:
                      if domain["service"] not in ("sniff", "sniff-v2"):
                          raise SystemExit("::error::The hostname is attached to an unexpected Worker")
                  for domain in attached:
                      api(domains + "/" + domain["id"], method="DELETE")
                      try:
                          ensure_dns()
                      except Exception:
                          # Restore the original attachment if DNS creation fails.
                          api(domains, {key: domain[key] for key in ("hostname", "service", "zone_id")}, method="PUT")
                          raise
                      print("Replaced custom-domain attachment with proxied DNS")
                  if not attached:
                      ensure_dns()
                  PYTHON

            - name: Prepare Worker secrets
              env:
                  STABLE_EMAIL: ${{ secrets.STABLE_EMAIL }}
                  STABLE_AAS_TOKEN: ${{ secrets.STABLE_AAS_TOKEN }}
                  BETA_EMAIL: ${{ secrets.BETA_EMAIL }}
                  BETA_AAS_TOKEN: ${{ secrets.BETA_AAS_TOKEN }}
                  ALPHA_EMAIL: ${{ secrets.ALPHA_EMAIL }}
                  ALPHA_AAS_TOKEN: ${{ secrets.ALPHA_AAS_TOKEN }}
              run: |
                  python3 - <<'PYTHON'
                  import json
                  import os
                  from pathlib import Path

                  required = ("STABLE_EMAIL", "STABLE_AAS_TOKEN")
                  optional = ("BETA_EMAIL", "BETA_AAS_TOKEN", "ALPHA_EMAIL", "ALPHA_AAS_TOKEN")
                  for name in required:
                      if not os.environ.get(name):
                          raise SystemExit(f"::error::GitHub secret {name} is missing or empty")
                  secrets = {name: os.environ[name] for name in required + optional if os.environ.get(name)}
                  path = Path(os.environ["RUNNER_TEMP"]) / "sniff-secrets.json"
                  path.touch(mode=0o600)
                  path.write_text(json.dumps(secrets))
                  PYTHON

            - name: Deploy API ${{ github.ref_name }} to Cloudflare Workers
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: bunx --bun wrangler deploy --config wrangler.deploy.json --secrets-file "$RUNNER_TEMP/sniff-secrets.json"

            - name: Remove temporary secrets
              if: always()
              run: rm -f "$RUNNER_TEMP/sniff-secrets.json" wrangler.deploy.json
