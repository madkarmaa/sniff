name: Deploy Worker

on:
    push:
        branches:
            - 'v*'
    workflow_dispatch:

concurrency:
    group: deploy-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    deploy:
        if: github.ref_type == 'branch' && startsWith(github.ref_name, 'v')
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Cache Bun
              uses: actions/cache@v5
              with:
                  path: '**/node_modules'
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Cache Rust
              uses: Swatinem/rust-cache@v2

            - name: Setup Bun
              id: bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Bun install
              run: bun install --frozen-lockfile

            - name: Configure branch deployment
              env:
                  API_BRANCH: ${{ github.ref_name }}
              run: |
                  bun - <<'JS'
                  const branch = process.env.API_BRANCH;
                  if (!/^v[0-9]+$/.test(branch)) throw new Error('Expected a version branch such as v1');
                  const config = Bun.TOML.parse(await Bun.file('wrangler.toml').text());
                  const { pattern, zone_name } = config.routes[0];
                  const hostname = pattern.split('/')[0];
                  config.name = `${config.name.replace(/-v[0-9]+$/, '')}-${branch}`;
                  config.routes = ['', '/*'].map(suffix => ({ pattern: `${hostname}/${branch}${suffix}`, zone_name }));
                  await Bun.write('wrangler.deploy.json', JSON.stringify(config));
                  JS

            - name: Prepare Worker secrets
              env:
                  STABLE_EMAIL: ${{ secrets.STABLE_EMAIL }}
                  STABLE_AAS_TOKEN: ${{ secrets.STABLE_AAS_TOKEN }}
                  BETA_EMAIL: ${{ secrets.BETA_EMAIL }}
                  BETA_AAS_TOKEN: ${{ secrets.BETA_AAS_TOKEN }}
                  ALPHA_EMAIL: ${{ secrets.ALPHA_EMAIL }}
                  ALPHA_AAS_TOKEN: ${{ secrets.ALPHA_AAS_TOKEN }}
              run: |
                  bun - <<'JS'
                  import { writeFile } from 'node:fs/promises';
                  const required = ['STABLE_EMAIL', 'STABLE_AAS_TOKEN'];
                  for (const name of required) {
                    if (!process.env[name]) throw new Error(`GitHub secret ${name} is missing or empty`);
                  }
                  const secrets = Object.fromEntries(Object.entries(process.env).filter(
                    ([name, value]) => /^(STABLE|BETA|ALPHA)_(EMAIL|AAS_TOKEN)$/.test(name) && value
                  ));
                  await writeFile(`${process.env.RUNNER_TEMP}/sniff-secrets.json`, JSON.stringify(secrets), { mode: 0o600 });
                  JS

            - name: Deploy API ${{ github.ref_name }} to Cloudflare Workers
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: bunx --bun wrangler deploy --config wrangler.deploy.json --secrets-file "$RUNNER_TEMP/sniff-secrets.json"

            - name: Ensure default branch DNS and catch-all route
              if: github.ref_name == github.event.repository.default_branch
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  bun - <<'JS'
                  async function api(path, method = 'GET', data) {
                    const response = await fetch(`https://api.cloudflare.com/client/v4/${path}`, {
                      method,
                      headers: {
                        Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
                        'Content-Type': 'application/json'
                      },
                      body: data === undefined ? undefined : JSON.stringify(data),
                      signal: AbortSignal.timeout(30_000)
                    });
                    const result = await response.json();
                    if (!response.ok || !result.success) {
                      throw new Error(`Cloudflare API returned ${response.status}: ${JSON.stringify(result.errors)}`);
                    }
                    return result.result;
                  }
                  const config = await Bun.file('wrangler.deploy.json').json();
                  const hostname = config.routes[0].pattern.split('/')[0];
                  const query = new URLSearchParams({ name: config.routes[0].zone_name, 'account.id': process.env.CLOUDFLARE_ACCOUNT_ID });
                  const zones = await api(`zones?${query}`);
                  if (zones.length !== 1) throw new Error('Expected exactly one Cloudflare zone');
                  const dns = `zones/${zones[0].id}/dns_records`;
                  const records = await api(`${dns}?${new URLSearchParams({ name: hostname })}`);
                  if (!records.some(record => record.type === 'AAAA' && record.content === '100::' && record.proxied)) {
                    await api(dns, 'POST', { type: 'AAAA', name: hostname, content: '100::', proxied: true, ttl: 1 });
                  }
                  const routes = `zones/${zones[0].id}/workers/routes`;
                  const pattern = `${hostname}/*`;
                  const existing = (await api(routes)).find(route => route.pattern === pattern);
                  await api(existing ? `${routes}/${existing.id}` : routes, existing ? 'PUT' : 'POST', { pattern, script: config.name });
                  JS

            - name: Remove temporary secrets
              if: always() && steps.bun.outcome == 'success'
              run: |
                  bun - <<'JS'
                  import { rm } from 'node:fs/promises';
                  await Promise.all([
                    rm(`${process.env.RUNNER_TEMP}/sniff-secrets.json`, { force: true }),
                    rm('wrangler.deploy.json', { force: true })
                  ]);
                  JS
