name: Release Android app

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: android-release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            # The release commit only changes the app version, so it skips the hooks.
            HUSKY: "0"
            ANDROID_BUILD_TOOLS: "36.0.0"
        steps:
            - name: Checkout with release history
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Cache Bun
              uses: actions/cache@v6
              with:
                  path: "**/node_modules"
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.4"

            - name: Setup Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Setup Android SDK
              uses: android-actions/setup-android@v4
              with:
                  packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"
                  log-accepted-android-sdk-licenses: false

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Bun install
              run: bun install --frozen-lockfile

            # semantic-release only publishes from the branches in .releaserc.mjs.
            - name: Release
              run: bun run release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
