name = "sniff-v3"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-13"

routes = [
  { pattern = "sniff.madkarma.top/v3", zone_name = "madkarma.top" },
  { pattern = "sniff.madkarma.top/v3/*", zone_name = "madkarma.top" },
  { pattern = "sniff.madkarma.top/*", zone_name = "madkarma.top" }
]

[build]
command = "cargo install -q --locked worker-build@0.9.0 && worker-build --release --locked"

[vars]
DEVICE_NAME="px_9a"

[observability]
enabled = true

# Google Play sessions and their registered devices, shared by every isolate
# so each cold start does not check a new device in on the accounts. There is
# no `id` because Wrangler creates the namespace on the first deploy.
[[kv_namespaces]]
binding = "SESSIONS"

# Uncached lookups per client address and Cloudflare location. The period
# must match `rate_limit::PERIOD_SECS`; `namespace_id` is any account-unique
# integer.
[[ratelimits]]
name = "LOOKUP_LIMITER"
namespace_id = "3001"
simple = { limit = 10, period = 60 }
